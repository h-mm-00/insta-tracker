name: Daily Instagram Sync

on:
  schedule:
    # UTC 09:10 = 한국 시간(KST) 매일 오후 6시 10분
    - cron: '10 9 * * *'
  workflow_dispatch: # 테스트로 바로 눌러볼 수 있는 수동 실행 버튼

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install firebase-admin apify-client

      - name: Run Crawler
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python sync_instagram.py

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>인스타 게시물 트래커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --ink: #14171f;
  --muted: #5e6878;
  --line: #e2e5eb;
  --soft: #edf0f5;
  --genie: #1062de;
  --genie-bg: #e5effd;
  --melon: #0aa849;
  --melon-bg: #e1f7e9;
  --warn: #d9381e;
  --font-body: 'IBM Plex Sans KR', system-ui, -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1217;
    --surface: #171b22;
    --ink: #e8ebf0;
    --muted: #9aa3b0;
    --line: #272d38;
    --soft: #202632;
    --genie: #5f9eff;
    --genie-bg: #132749;
    --melon: #40d67c;
    --melon-bg: #0f331e;
    --warn: #ff765b;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.55;
  margin: 0;
}
.wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding: 32px 20px 64px;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }

/* Header */
.head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line);
}
h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.lede { margin: 6px 0 0; color: var(--muted); font-size: 13.5px; }
.handles { display: flex; gap: 14px; font-family: var(--font-mono); font-size: 13px; }
.handles a { border-bottom: 1px solid currentColor; }
.handles .g { color: var(--genie); }
.handles .m { color: var(--melon); }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 24px; }
.seg { display: inline-flex; background: var(--soft); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button {
  border: 0; background: transparent; padding: 6px 14px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 500; font-size: 13px;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); font-weight: 600; }
.spacer { flex: 1 1 auto; }
.ghost {
  border: 1px solid var(--line); background: var(--surface); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500;
}
.ghost:hover { border-color: var(--muted); }

/* Layout Grid */
.layout { display: flex; flex-direction: column; gap: 24px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
h2 { margin: 0 0 16px; font-size: 16px; font-weight: 600; }

/* Summary Cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 18px; }
.card { display: flex; flex-direction: column; gap: 16px; }
.card.genie { --theme: var(--genie); --theme-bg: var(--genie-bg); }
.card.melon { --theme: var(--melon); --theme-bg: var(--melon-bg); }
.card-top { display: flex; justify-content: space-between; align-items: baseline; }
.card-name { font-size: 17px; font-weight: 600; }
.total { font-family: var(--font-mono); font-size: 32px; font-weight: 600; }
.total small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 4px; }
.split { font-size: 12.5px; color: var(--muted); }

.bars { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
@media (max-width: 600px) { .bars { grid-template-columns: 1fr; } }
.bar-row { display: flex; flex-direction: column; gap: 4px; }
.bar-meta { display: flex; justify-content: space-between; font-size: 12.5px; }
.bar-meta .ct { font-family: var(--font-mono); font-weight: 500; }
.track { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
.fill { height: 100%; border-radius: 3px; background: var(--theme); }

/* Calendar */
.cal-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.cal-title { font-size: 17px; font-weight: 600; flex: 1 1 auto; }
.cal-title small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 8px; font-family: var(--font-mono); }
.cal-wk, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal-wk { text-align: center; font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
.cc {
  display: flex; flex-direction: column; gap: 4px; min-height: 104px; padding: 8px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; text-align: left;
}
.cc.out { border-color: transparent; background: transparent; cursor: default; }
.cc.sel { border-color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.dn { font-family: var(--font-mono); font-size: 12px; font-weight: 500; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.cc.today .dn { background: var(--ink); color: var(--bg); }
.evs { display: flex; flex-direction: column; gap: 3px; }
.ev {
  font-size: 11px; padding: 2px 6px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: var(--soft); color: var(--ink); font-weight: 500;
}
.more { font-size: 11px; color: var(--muted); padding-left: 4px; }

/* Log List */
.log-panel { margin-top: 8px; }
.log-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
.rows { list-style: none; margin: 0; padding: 0; }
.row {
  display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--soft); align-items: flex-start;
}
.row:last-child { border-bottom: 0; }
.chip { font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 6px; flex: none; }
.chip.genie { background: var(--genie-bg); color: var(--genie); }
.chip.melon { background: var(--melon-bg); color: var(--melon); }
.rmain { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.rtop { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.kind { font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }
.kind.reel { border-color: var(--ink); color: var(--ink); }
.ser-tag { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: var(--soft); }
.art { font-size: 13.5px; font-weight: 600; }
.memo { margin: 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.ract { flex: none; font-size: 13px; }
.ract a { color: var(--muted); border-bottom: 1px solid transparent; }
.ract a:hover { color: var(--ink); border-color: currentColor; }
.empty { padding: 32px 0; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<div class="wrap">
  <header class="head">
    <div>
      <h1>인스타 게시물 트래커</h1>
      <p class="lede">지니뮤직과 멜론의 공식 인스타그램 피드 및 릴스 시리즈 자동 아카이브</p>
    </div>
    <div class="handles">
      <a class="g" href="https://www.instagram.com/genie_music/" target="_blank" rel="noopener">@genie_music</a>
      <a class="m" href="https://www.instagram.com/melon_music/" target="_blank" rel="noopener">@melon_music</a>
    </div>
  </header>

  <div class="toolbar">
    <div class="seg" id="seg-view" role="group">
      <button type="button" data-v="cal" aria-pressed="true">달력 보기</button>
      <button type="button" data-v="list" aria-pressed="false">목록 전체보기</button>
    </div>
    <div class="seg" id="seg-acct" role="group">
      <button type="button" data-v="all" aria-pressed="true">전체</button>
      <button type="button" data-v="genie" aria-pressed="false">지니뮤직</button>
      <button type="button" data-v="melon" aria-pressed="false">멜론</button>
    </div>
    <div class="seg" id="seg-period" role="group" hidden>
      <button type="button" data-v="7" aria-pressed="false">7일</button>
      <button type="button" data-v="30" aria-pressed="true">30일</button>
      <button type="button" data-v="all" aria-pressed="false">전체</button>
    </div>
    <span class="spacer"></span>
    <button type="button" class="ghost" id="btn-export">CSV 저장</button>
  </div>

  <main class="layout">
    <!-- 시리즈별 집계 요약 카드 -->
    <section class="cards" id="cards"></section>

    <!-- 달력 및 게시물 리스트 패널 -->
    <section class="panel log-panel">
      <div id="cal"></div>
      <div class="log-head">
        <h2 id="log-title">기록 상세</h2>
        <span class="split" id="log-count">0건</span>
      </div>
      <div id="log"></div>
    </section>
  </main>
</div>

<script>
// ========================================================
// 1. Firebase 설정 (본인의 Firebase 웹 config 붙여넣기)
// ========================================================
var firebaseConfig = {
  apiKey: "AIzaSyBIi2WfYMEGSyNbUEhhwjIK5ffw3A5sOA0",
  authDomain: "instatracker-b9ccb.firebaseapp.com",
  projectId: "instatracker-b9ccb",
  storageBucket: "instatracker-b9ccb.firebasestorage.app",
  messagingSenderId: "397309844155",
  appId: "1:397309844155:web:d473b8e364ea34ac9b279e",
  measurementId: "G-B97GHW8EKL"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
var db = firebase.firestore();

// ========================================================
// 2. 자체 내장 시리즈 및 컬러 매핑 정의
// ========================================================
var SERIES_MAP = {
  melon: [
    { name: '스포트라이트', bg: '#fef08a', color: '#854d0e' },
    { name: '하이라이징', bg: '#fed7aa', color: '#9a3412' },
    { name: '뮤직웨이브', bg: '#bfdbfe', color: '#1e40af' },
    { name: 'MMA', bg: '#fbcfe8', color: '#9d174d' },
    { name: 'Data Lab', bg: '#e9d5ff', color: '#6b21a8' },
    { name: 'Global-K Chart', bg: '#c7d2fe', color: '#3730a3' },
    { name: '아뭘듣', bg: '#bbf7d0', color: '#166534' },
    { name: '오프라인', bg: '#ddd6fe', color: '#5b21b6' },
    { name: '기타', bg: '#f1f5f9', color: '#475569' }
  ],
  genie: [
    { name: '스트림파티', bg: '#bae6fd', color: '#0369a1' },
    { name: '지니인사이드', bg: '#fed7aa', color: '#9a3412' },
    { name: '지니인사이드, 옥외광고', bg: '#fde68a', color: '#854d0e' },
    { name: '지니에 왔지니', bg: '#bbf7d0', color: '#166534' },
    { name: '러닝', bg: '#ddd6fe', color: '#5b21b6' },
    { name: '기타', bg: '#f1f5f9', color: '#475569' }
  ]
};

(function () {
  var ACC = {
    genie: { name: '지니뮤직', short: '지니' },
    melon: { name: '멜론', short: '멜론' }
  };
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  var state = {
    posts: [],
    acct: 'all',
    period: '30',
    view: 'cal',
    cy: new Date().getFullYear(),
    cm: new Date().getMonth(),
    selDay: ymd(new Date()),
    loaded: false
  };

  function $(id) { return document.getElementById(id); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayStr() { return ymd(new Date()); }
  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function getSeriesStyle(acct, seriesName) {
    var list = SERIES_MAP[acct] || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].name === seriesName) return list[i];
    }
    return { bg: '#f1f5f9', color: '#475569' };
  }

  function visibleAccts() {
    return state.acct === 'all' ? ['genie', 'melon'] : [state.acct];
  }

  function inDateRange(d) {
    if (state.view === 'cal') return d.slice(0, 7) === state.cy + '-' + pad(state.cm + 1);
    if (state.period === 'all') return true;
    var limit = new Date(); limit.setDate(limit.getDate() - parseInt(state.period, 10) + 1);
    return d >= ymd(limit);
  }

  function getFilteredPosts() {
    var accts = visibleAccts();
    return state.posts.filter(function (p) {
      return accts.indexOf(p.account) > -1 && inDateRange(p.date);
    }).sort(function (a, b) {
      return a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt || 0) - (a.createdAt || 0);
    });
  }

  function renderCards() {
    var html = '';
    visibleAccts().forEach(function (acct) {
      var acctPosts = state.posts.filter(function (p) {
        return p.account === acct && inDateRange(p.date);
      });
      var feedCount = acctPosts.filter(function (p) { return p.kind === 'feed'; }).length;
      var reelCount = acctPosts.filter(function (p) { return p.kind === 'reel'; }).length;

      var counts = {};
      acctPosts.forEach(function (p) {
        var s = p.series || '기타';
        counts[s] = (counts[s] || 0) + 1;
      });

      var seriesList = SERIES_MAP[acct];
      var max = 1;
      seriesList.forEach(function (s) {
        if ((counts[s.name] || 0) > max) max = counts[s.name];
      });

      var bars = seriesList.map(function (s) {
        var c = counts[s.name] || 0;
        return '<li class="bar-row">' +
          '<div class="bar-meta"><span style="font-weight:500;">' + esc(s.name) + '</span><span class="ct">' + c + '</span></div>' +
          '<div class="track"><div class="fill" style="width:' + (c / max * 100) + '%;background:' + s.color + '"></div></div>' +
        '</li>';
      }).join('');

      html += '<article class="panel card ' + acct + '">' +
        '<div class="card-top">' +
          '<div><div class="card-name">' + ACC[acct].name + '</div><div class="split">피드 ' + feedCount + ' · 릴스 ' + reelCount + '</div></div>' +
          '<div class="total">' + acctPosts.length + '<small>건</small></div>' +
        '</div>' +
        '<ul class="bars">' + bars + '</ul>' +
      '</article>';
    });
    $('cards').innerHTML = html;
  }

  function renderCal() {
    if (state.view !== 'cal') { $('cal').innerHTML = ''; return; }
    var y = state.cy, m = state.cm, accts = visibleAccts(), by = {};
    state.posts.forEach(function (p) {
      if (accts.indexOf(p.account) > -1) {
        (by[p.date] = by[p.date] || []).push(p);
      }
    });

    var first = new Date(y, m, 1).getDay();
    var dim = new Date(y, m + 1, 0).getDate();
    var total = Math.ceil((first + dim) / 7) * 7;
    var key = y + '-' + pad(m + 1), count = 0, cells = '', today = todayStr();

    for (var i = 0; i < total; i++) {
      var day = i - first + 1;
      if (day < 1 || day > dim) {
        cells += '<div class="cc out" aria-hidden="true"></div>';
        continue;
      }
      var ds = key + '-' + pad(day);
      var list = (by[ds] || []).sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
      count += list.length;

      var evs = list.slice(0, 3).map(function (p) {
        var style = getSeriesStyle(p.account, p.series);
        var label = (p.artist ? p.artist : p.series) || (p.kind === 'reel' ? '릴스' : '피드');
        return '<span class="ev" style="background:' + style.bg + ';color:' + style.color + '">' + esc(label) + '</span>';
      }).join('');

      if (list.length > 3) evs += '<span class="more">+' + (list.length - 3) + '건</span>';

      cells += '<button type="button" class="cc' + (ds === today ? ' today' : '') + (ds === state.selDay ? ' sel' : '') + '" data-d="' + ds + '">' +
        '<span class="dn">' + day + '</span><div class="evs">' + evs + '</div></button>';
    }

    $('cal').innerHTML =
      '<div class="cal-nav">' +
        '<div class="cal-title"><strong>' + y + '년 ' + (m + 1) + '월</strong><small>' + count + '건 발행</small></div>' +
        '<button type="button" class="ghost" data-nav="prev">‹</button>' +
        '<button type="button" class="ghost" data-nav="today">오늘</button>' +
        '<button type="button" class="ghost" data-nav="next">›</button>' +
      '</div>' +
      '<div class="cal-wk">' + WD.map(function(w){ return '<span>' + w + '</span>'; }).join('') + '</div>' +
      '<div class="cal-grid">' + cells + '</div>';
  }

  function rowHtml(p) {
    var style = getSeriesStyle(p.account, p.series);
    var link = p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">인스타 열기 ↗</a>' : '';
    return '<li class="row">' +
      '<span class="chip ' + p.account + '">' + ACC[p.account].short + '</span>' +
      '<div class="rmain">' +
        '<div class="rtop">' +
          '<span class="kind ' + p.kind + '">' + (p.kind === 'reel' ? '릴스' : '피드') + '</span>' +
          '<span class="ser-tag" style="background:' + style.bg + ';color:' + style.color + '">' + esc(p.series || '기타') + '</span>' +
          (p.artist ? '<span class="art">' + esc(p.artist) + '</span>' : '') +
          '<span class="split" style="font-family:var(--font-mono);">' + p.date + '</span>' +
        '</div>' +
        (p.memo ? '<p class="memo">' + esc(p.memo) + '</p>' : '') +
      '</div>' +
      '<div class="ract">' + link + '</div>' +
    '</li>';
  }

  function renderLog() {
    if (!state.loaded) {
      $('log').innerHTML = '<div class="empty">데이터를 동기화하는 중…</div>';
      return;
    }

    if (state.view === 'cal') {
      var d = state.selDay;
      var posts = state.posts.filter(function (p) {
        return p.date === d && visibleAccts().indexOf(p.account) > -1;
      }).sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });

      $('log-title').textContent = d + ' (' + WD[new Date(d).getDay()] + ')';
      $('log-count').textContent = posts.length + '건';

      if (!posts.length) {
        $('log').innerHTML = '<div class="empty">해당 날짜에 수집된 게시물이 없습니다.</div>';
        return;
      }
      $('log').innerHTML = '<ul class="rows">' + posts.map(rowHtml).join('') + '</ul>';
    } else {
      $('log-title').textContent = '기간 내 전체 목록';
      var posts = getFilteredPosts();
      $('log-count').textContent = posts.length + '건';

      if (!posts.length) {
        $('log').innerHTML = '<div class="empty">조건에 해당하는 게시물이 없습니다.</div>';
        return;
      }
      $('log').innerHTML = '<ul class="rows">' + posts.map(rowHtml).join('') + '</ul>';
    }
  }

  function renderAll() {
    renderCards();
    renderCal();
    renderLog();
  }

  function setPressed(container, val) {
    container.querySelectorAll('button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === val));
    });
  }

  // Toolbar Events
  $('seg-view').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.view = b.getAttribute('data-v');
    setPressed($('seg-view'), state.view);
    $('seg-period').hidden = (state.view === 'cal');
    renderAll();
  });

  $('seg-acct').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.acct = b.getAttribute('data-v');
    setPressed($('seg-acct'), state.acct);
    renderAll();
  });

  $('seg-period').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.period = b.getAttribute('data-v');
    setPressed($('seg-period'), state.period);
    renderAll();
  });

  $('cal').addEventListener('click', function (e) {
    var n = e.target.closest('button[data-nav]');
    if (n) {
      var dir = n.getAttribute('data-nav');
      if (dir === 'today') {
        var t = new Date(); state.cy = t.getFullYear(); state.cm = t.getMonth(); state.selDay = todayStr();
      } else {
        var d = new Date(state.cy, state.cm + (dir === 'prev' ? -1 : 1), 1);
        state.cy = d.getFullYear(); state.cm = d.getMonth(); state.selDay = ymd(d);
      }
      renderAll();
      return;
    }
    var c = e.target.closest('button[data-d]');
    if (c) {
      state.selDay = c.getAttribute('data-d');
      renderCal();
      renderLog();
    }
  });

  $('btn-export').addEventListener('click', function () {
    var posts = getFilteredPosts();
    if (!posts.length) return alert('내보낼 데이터가 없습니다.');
    var rows = [['게시일', '계정', '유형', '시리즈', '아티스트', 'URL', '메모']].concat(posts.map(function(p){
      return [p.date, ACC[p.account].name, p.kind, p.series || '기타', p.artist || '', p.url || '', p.memo || ''];
    }));
    var csv = '\uFEFF' + rows.map(function(r){ return r.map(function(v){ return '"' + String(v||'').replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'instagram_archive_' + todayStr() + '.csv'; a.click();
  });

  // Firestore 연결
  db.collection('posts').orderBy('date', 'desc').limit(2000).onSnapshot(function (snap) {
    state.posts = snap.docs.map(function (d) { var x = d.data() || {}; x.id = d.id; return x; });
    state.loaded = true;
    renderAll();
  });

})();
</script>
</body>
</html>
